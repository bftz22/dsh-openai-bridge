# dsh-openai-bridge 运行时配置（Windows 版）
# 说明：本文件改编自 DeepSeek Harness 官方示例
#   https://github.com/deepseek-ai/deepseek-harness/blob/main/examples/jsonrpc-agent/cordis.yml
#   （MIT License, Copyright (c) DeepSeek AI）
# 用途：以 headless 方式启动 dsh 运行时（dsh-jsonrpc-agent），
#       stdout 保留给 JSON-RPC 协议，请勿在此添加 console logger 或终端 UI。
#
# Windows 差异：dsh 的 bash 执行器仅支持 POSIX（官方声明），
# 这里改用官方 Windows 对应实现 pwsh-local（自动探测 PowerShell 7，
# 找不到则回退到 Windows 自带的 PowerShell 5.1），工具为 pwsh。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# DeepSeek 模型适配器。默认：每次请求都开启完整思考（max effort）。
# 模型名由桥接服务经 JSON-RPC 按会话传入，因此这里不固定。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# PowerShell 执行器（Windows 对应 bash-local；自动解析 pwsh/powershell 路径）
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

# shell-env：向每次 pwsh 调用注入受信任的 DSH_* 环境（tool-pwsh 依赖）
- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    # spine 默认捆绑 bash 工具；Windows 上改用独立的 tool-pwsh，故关掉
    toolBash: false
    toolJobs: false

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
